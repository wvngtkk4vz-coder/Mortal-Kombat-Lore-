function paint(c){const g=c.getContext('2d'),A=ARN.p;g.fillStyle='#14090c';g.fillRect(0,0,640,300);g.fillStyle='#2a1015';g.fillRect(0,250,640,50);
g.save();if(ARN.sh>0){g.translate(R(ARN.sh)-ARN.sh/2,R(ARN.sh)-ARN.sh/2);ARN.sh--}
g.fillStyle='#6b0d14';ARN.blood.forEach(b=>{g.beginPath();g.ellipse(b,252+(b%7),5,2,0,0,7);g.fill()});
ARN.part=ARN.part.filter(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.6;g.fillStyle='#b01020';g.fillRect(q.x,q.y,3,3);if(q.y>=250){if(ARN.blood.length<400)ARN.blood.push(q.x|0);return false}return true});
A.forEach(p=>fig(g,p));A.forEach((p,i)=>{const x=i?340:20;g.fillStyle='#333';g.fillRect(x,12,280,14);g.fillStyle='#d6222b';const w=280*p.hp/p.max;g.fillRect(i?x+280-w:x,12,w,14);g.fillStyle='#e0a526';g.fillRect(i?x+280-p.sp*2.8:x,28,p.sp*2.8,5);g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign=i?'right':'left';g.fillText(p.name.toUpperCase(),i?x+280:x,46)});
if(ARN.msg){g.fillStyle='#e0a526';g.font='900 34px Impact';g.textAlign='center';g.fillText(ARN.msg,320,120)}g.restore();A.forEach(p=>{if(p.hit>0)p.hit--;if(p.atk>0)p.atk--})}
// ---- multiplayer (host runs the sim, guest sends inputs)
function vsHit(i,m){const A=ARN.p,p=A[i],o=A[1-i],s=p.f.stats;let d=(s.str*.5+s.pow*.5)*.18*m*(.8+Math.random()*.4);if(Math.random()<.04+s.lck*.002)d*=1.7;if(o.blk)d*=.2;else{bleed(o,m>1?40:12)}o.hp-=d;o.hit=8;o.x=cl(o.x+p.face*(m>1?25:10),30,610);p.sp=Math.min(100,p.sp+12);o.sp=Math.min(100,o.sp+6);ARN.sh=m>1?8:3;
if(o.hp<=0){o.hp=0;o.dead=true;ARN.over=i;ARN.msg='FINISH HIM';VS.fin=Date.now()}}
function vsStep(){const A=ARN.p;if(A.length<2)return;if(ARN.over!==null){const w=A[ARN.over];if(VS.fin&&(VS.in[ARN.over].s||Date.now()-VS.fin>6000)){const was=VS.in[ARN.over].s;VS.fin=0;if(was){bleed(A[1-ARN.over],200);ARN.msg=w.name.toUpperCase()+' — '+(w.f.fin||'FINISHER').toUpperCase()}else ARN.msg=w.name.toUpperCase()+' WINS';VS.done=Date.now();VS.in[ARN.over].s=false;if(was)setTimeout(()=>{ARN.msg=w.name.toUpperCase()+' WINS'},2200)}}
else A.forEach((p,i)=>{const k=VS.in[i],o=A[1-i],st=p.f.stats;p.blk=k.b?1:0;if(p.cd>0)p.cd--;if(!k.b)p.x=cl(p.x+(2+st.spd/30)*(k.r?1:k.l?-1:0),30,610);p.face=o.x>=p.x?1:-1;const d=Math.abs(o.x-p.x);
if(k.a&&!p.cd&&!p.blk){p.cd=10;p.atk=6;if(d<75)vsHit(i,1)}if(k.s&&p.sp>=100&&!p.cd){p.sp=0;p.cd=20;p.atk=10;if(d<120)vsHit(i,2.4)}k.a=k.s=false});
if(VS.room)VS.room.emit('st',{p:A.map(p=>[p.x,p.hp,p.sp,p.atk,p.hit,p.blk,p.dead?1:0,p.face]),o:ARN.over,m:ARN.msg})}
function vsNew(){ARN.p=[mkP(VS.my,0,hpOf(VS.my)),mkP(VS.opp,1,hpOf(VS.opp))];ARN.blood=[];ARN.part=[];ARN.over=null;ARN.msg='';VS.in=[{},{}];VS.fin=0}
const hpOf=f=>Math.round(70+f.stats.dur*.7+f.stats.sta*.2);
function gotSt(d){if(VS.host||ARN.p.length<2)return;d.p.forEach((a,i)=>{const p=ARN.p[i];if(a[4]>p.hit)bleed(p,a[6]&&!p.dead?160:14);Object.assign(p,{x:a[0],hp:a[1],sp:a[2],atk:a[3],hit:a[4],blk:a[5],dead:!!a[6],face:a[7]})});ARN.over=d.o;ARN.msg=d.m}
async function joinVS(){if(VS.joined)return;const f=FM(document.getElementById('vf').value),code=(document.getElementById('vc').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20);if(!f||!code)return alert('Pick a fighter and enter a room code');
const R0=window.claude&&await claude.use('room');if(!R0)return alert('Multiplayer needs the published page (room unavailable here).');VS.joined=true;VS.my=f;const rm=VS.room=await R0.join('fight'+code);
const hi=()=>rm.emit('hi',{rid:VS.rid,f:{name:f.name,nick:f.nick,fin:f.fin,abil:f.abil,sigs:f.sigs,weapon:f.weapon,stats:f.stats,look:f.look,id:'v'+f.id}});
rm.on('hi',m=>{if(m.isMe||!m.data||VS.opp)return;VS.opp=m.data.f;VS.host=VS.rid<m.data.rid;hi();ARN.p=[];if(VS.host){const g=VS.my,o=VS.opp;VS.my=g;vsNew();if(!VS.timer)VS.timer=setInterval(vsStep,50)}else{ARN.p=[mkP(VS.opp,0,hpOf(VS.opp)),mkP(VS.my,1,hpOf(VS.my))]}document.getElementById('vs').textContent='Opponent: '+VS.opp.name+(VS.host?' (you host, P1)':' (you are P2)');loop()});
rm.on('in',m=>{if(VS.host&&!m.isMe)VS.in[1]=m.data});rm.on('st',m=>{if(!m.isMe)gotSt(m.data)});hi();document.getElementById('vs').textContent='Waiting for a friend to join room "'+code+'"…'}
function vk(k,v){VS.k[k]=v;if(!VS.opp)return;if(VS.host)VS.in[0]={...VS.k};else{VS.room.emit('in',{...VS.k});VS.k.a=false;VS.k.s=false}}
const KM={a:'l',arrowleft:'l',d:'r',arrowright:'r',j:'a',k:'b',l:'s'};
['keydown','keyup'].forEach(ev=>addEventListener(ev,e=>{const k=KM[e.key.toLowerCase()];if(k&&tab=='Versus'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();if(e.repeat&&(k=='a'||k=='s'))return;vk(k,ev=='keydown')}}));
function drawVS(){const o=G.f.filter(f=>!f.dead&&!f.ret).map(f=>`<option value="${f.id}">${E(f.name)}</option>`).join('');
document.getElementById('main').innerHTML=`<h2>VERSUS — FIGHT YOUR FRIENDS</h2><div class="card"><div class="m">Everyone creates fighters on their own device, picks one, and joins the same room code. Controls: A/D move · J punch · K block · L special (when full). Friends must be given access to this page.</div><div class="row"><select id="vf" style="flex:1">${o}</select><input type="text" id="vc" placeholder="room code" style="flex:1"><button class="pri" onclick="joinVS()">JOIN</button></div><div id="vs" class="m">${VS.joined?'Joined.':'Not joined.'}</div></div>${cv()}<div class="row" style="justify-content:center;margin-top:8px">${[['l','◀'],['r','▶'],['a','👊'],['b','🛡'],['s','⚡']].map(([k,t])=>`<button style="font-size:22px;padding:12px 16px;touch-action:none" onpointerdown="vk('${k}',true)" onpointerup="vk('${k}',false)" onpointerleave="VS.k['${k}']&&vk('${k}',false)">${t}</button>`).join('')}</div>`;loop()}

const go=t=>{tab=t;draw()};
function bar(v,max,c){return`<div class="bar"><i style="width:${cl(v/max*100,0,100)}%;background:${c}"></i></div>`}
function draw(){$nav();const M=document.getElementById('main'),rk=rank();let h='';
if(tab=='Home'){const m=nextM();h=`<h2>CURRENT TOURNAMENT</h2><div class="card">${G.t?`<b>${E(G.t.name)}</b> ${G.t.done?'— Champion: '+E(FM(G.t.champ)?.name):'— Round '+(G.t.cur+1)}${m?`<div class="m">Next: ${E(FM(m.a).name)} vs ${E(FM(m.b).name)}</div>`:''}`:'<span class="m">None. Go to Tournaments.</span>'}</div><h2>LATEST NEWS</h2>${G.news.slice(0,6).map(nw).join('')||'<div class="m">Quiet realm. Go to CREATE FIGHTER to make your first fighters.</div>'}<h2>FIGHTERS: ${G.f.length}</h2>`}
else if(tab=='Create Fighter'){return drawCreate()}
else if(tab=='Fighters'){if(open&&FM(open)){const f=FM(open);h=`<button onclick="open=null;draw()">← Back</button><div class="card"><div class="row">${av(f,110)}<div><div class="big" style="text-align:left">${E(f.name)}</div><div>"${E(f.nick)}" · ${E(f.style)} · ${E(f.align)}</div><div class="m">Age ${E(f.age)} · ${E(f.height)} · ${E(f.origin)} · ${E(f.faction||'No faction')}</div></div></div><p>${E(f.story)}</p><div class="m">Personality: ${E(f.pers)} · Weakness: ${E(f.weak)} · Weapon: ${E(f.weapon)}</div><p><b>Abilities:</b> ${E(f.abil)}<br><b>Signatures:</b> ${E(f.sigs)}<br><b>Finisher:</b> ${E(f.fin)}</p><p>Record ${f.w}-${f.l} · KOs ${f.kos} · Titles ${f.titles} · Streak ${f.streak}${f.inj?' · INJURED':''}</p>${STATS.map(k=>`<div class="m">${SN[k]} ${f.stats[k]}</div>${bar(f.stats[k],100,'var(--a)')}`).join('')}</div>`}
else h=`<h2>ALL FIGHTERS (${G.f.length})</h2><div class="grid">${G.f.map(mk).join('')||'<div class="m">None yet.</div>'}</div>`}
else if(tab=='Tournaments'){h=`<h2>NEW TOURNAMENT</h2><div class="card"><label>Name</label><input type="text" id="tn" value="${E(cform.tn||'Blood Cup '+G.year)}" onchange="cform.tn=this.value"><label>Size</label><select id="ts" onchange="cform.ts=this.value">${[8,16,32,64,128].map(s=>`<option ${cform.ts==s?'selected':''}>${s}</option>`).join('')}</select><label><input type="checkbox" id="tp" ${cform.tp?'checked':''} onchange="cform.tp=this.checked"> Retirements/deaths enabled</label><label><input type="checkbox" ${seeded?'checked':''} onchange="seeded=this.checked"> Seed by ranking</label><div class="row" style="margin-top:8px"><button onclick="rndPick()">Randomize picks</button><button onclick="sel.clear();draw()">Clear</button><button class="pri" onclick="beginT()">START</button></div><div class="m">Selected ${sel.size}. Bracket uses the largest power of 2 that fits your picks (none picked = all fighters).</div></div><h2>CHOOSE FIGHTERS</h2><div class="grid">${G.f.filter(f=>!f.dead&&!f.ret).map(f=>`<div class="card" style="${sel.has(f.id)?'outline:2px solid var(--a)':''}" onclick="sel.has(${f.id})?sel.delete(${f.id}):sel.add(${f.id});draw()">${E(f.name)}<div class="m">${f.w}-${f.l}</div></div>`).join('')}</div>`}
else if(tab=='Bracket'){const T=G.t;h=T?`<h2>${E(T.name)}</h2><div class="row"><button onclick="simOne(true)" ${!nextM()||LIVE.timer?'disabled':''}>Watch next fight</button><button onclick="simOne(false);draw()" ${!nextM()||LIVE.timer?'disabled':''}>Sim next</button><button class="pri" onclick="simAll()" ${!nextM()||LIVE.timer?'disabled':''}>Sim entire tournament</button></div><div class="br">${T.rounds.map((rd,i)=>`<div class="rd"><div class="m">${rd.length==1?'FINAL':'Round '+(i+1)}</div>${rd.map(m=>`<div class="mt">${[m.a,m.b].map(id=>`<div class="${m.w==id?'w':''}">${E(FM(id)?.name)}</div>`).join('')}</div>`).join('')}</div>`).join('')}</div>`:'<div class="m">No tournament running.</div>'}
else if(tab=='Live Fight'){h=`<h2>LIVE FIGHT</h2><div class="row"><button onclick="simOne(true)">Start next fight</button><button onclick="endLive()">Skip</button></div>${cv()}<div class="feed card" id="fd" style="max-height:220px;overflow:auto"></div>`;M.innerHTML=h;LIVE.lines.slice(0,LIVE.i).forEach(l=>l[0]!='h'&&feedAdd(l));return loop()}
else if(tab=='Versus'){return drawVS()}
else if(tab=='Rankings'){h=`<h2>POWER RANKINGS</h2>${rk.map((f,i)=>`<div class="card row" onclick="open=${f.id};go('Fighters')">#${i+1} ${av(f,36)}<b>${E(f.name)}</b><span class="m">${f.w}-${f.l} · ${f.kos} finishes · ${f.titles} titles · streak ${f.streak}</span></div>`).join('')}`}
else if(tab=='Rivalries'){const o=G.f.map(f=>`<option value="${f.id}">${E(f.name)}</option>`).join('');h=`<h2>RIVALRIES</h2><div class="card row"><select id="r1">${o}</select><select id="r2">${o}</select><button onclick="mkRiv()">Create feud</button></div>`+Object.keys(G.riv).map(k=>{const[a,b]=k.split('|').map(Number),x=H(a,b);return FM(a)&&FM(b)?`<div class="card"><b>${E(FM(a).name)} vs ${E(FM(b).name)}</b><div class="m">${x.n} fights · ${E(x.last||'Unsettled score.')}</div></div>`:''}).join('')}
else if(tab=='News'){h='<h2>NEWS</h2>'+(G.news.map(nw).join('')||'<div class="m">Nothing yet.</div>')}
else if(tab=='History'){h='<h2>PAST CHAMPIONS</h2>'+(G.hist.map(c=>`<div class="card"><b>Year ${c.y}: ${E(c.name)}</b><div>${E(c.champ)}</div><div class="m">${E(c.final)}</div></div>`).join('')||'<div class="m">No history yet.</div>')}
else if(tab=='Hall of Fame'){h='<h2>HALL OF FAME</h2><div class="grid">'+G.f.filter(f=>f.titles>=1||G.hof.includes(f.id)).sort((a,b)=>score(b)-score(a)).map(mk).join('')+'</div>'}
M.innerHTML=h}
const nw=n=>`<div class="card"><b>${E(n.h)}</b><div class="m">Y${n.y} · ${E(n.t)}</div></div>`;
function $nav(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${t.toUpperCase()}</button>`).join('')}
function rndPick(){sel.clear();const s=+(cform.ts||8),a=G.f.filter(f=>!f.dead&&!f.ret).sort(()=>Math.random()-.5);a.slice(0,s).forEach(f=>sel.add(f.id));draw()}
function beginT(){if(LIVE.timer||(G.t&&!G.t.done&&!confirm('Replace current tournament?')))return;startT(document.getElementById('tn').value||'Cup',+document.getElementById('ts').value,[...sel],document.getElementById('tp').checked);sel.clear();go('Bracket')}
function mkRiv(){const a=+document.getElementById('r1').value,b=+document.getElementById('r2').value;if(!a||!b||a==b)return;G.riv[hk(a,b)]=1;news('Feud declared: '+FM(a).name+' vs '+FM(b).name,'Bad blood.');save();draw()}
let imgData='',cs={};
function drawCreate(){const o=(k)=>LOOK[k].map(v=>`<option>${v}</option>`).join('');const T=(id,l)=>`<label>${l}</label><input type="text" id="c_${id}">`;
document.getElementById('main').innerHTML=`<h2>CREATE FIGHTER</h2><div class="card"><div class="row"><button onclick="fillRnd()">🎲 Random fighter</button></div>${T('name','Name')+T('nick','Nickname / title')+T('age','Age')+T('height','Height')+T('origin','Origin')+T('faction','Faction (optional)')}<label>Backstory</label><textarea id="c_story"></textarea>${T('pers','Personality')}<label>Fighting style</label><input type="text" id="c_style" list="sty"><datalist id="sty">${STY.map(s=>`<option>${s}`).join('')}</datalist><label>Alignment</label><select id="c_align"><option>Hero<option>Villain<option>Neutral<option>Wildcard</select>${T('abil','Special abilities (comma separated)')+T('sigs','Signature moves (comma separated)')+T('fin','Finishing move')+T('weak','Weaknesses')+T('weapon','Weapon')}
<h2>LOOK</h2>${Object.keys(LOOK).map(k=>`<label>${k}</label><select id="l_${k}">${o(k)}</select>`).join('')}<div class="row"><div><label>Primary color</label><input type="color" id="l_c1" value="#aa2222"></div><div><label>Secondary color</label><input type="color" id="l_c2" value="#222244"></div></div><label>Portrait image (optional)</label><input type="file" id="c_img" accept="image/*" onchange="loadImg(this)">
<h2>STATS</h2>${STATS.map(k=>`<label>${SN[k]} <span id="v_${k}">50</span></label><input type="range" min="1" max="99" value="50" id="s_${k}" oninput="v_${k}.textContent=this.value">`).join('')}<button class="pri" style="margin-top:12px;width:100%" onclick="saveF()">CREATE FIGHTER</button></div>`}
function loadImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(im,0,0,160,160);imgData=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function fillRnd(){const r=rndFighter();['name','nick','age','height','origin','faction','story','pers','style','abil','sigs','fin','weak','weapon'].forEach(k=>document.getElementById('c_'+k).value=r[k]);document.getElementById('c_align').value=r.align;Object.keys(LOOK).forEach(k=>document.getElementById('l_'+k).value=r.look[k]);['c1','c2'].forEach(k=>document.getElementById('l_'+k).value=r.look[k]);STATS.forEach(k=>{document.getElementById('s_'+k).value=r.stats[k];document.getElementById('v_'+k).textContent=r.stats[k]})}
function saveF(){const g=k=>document.getElementById(k).value,name=g('c_name').trim();if(!name)return alert('Name required');if(G.f.some(f=>f.name.toLowerCase()==name.toLowerCase()))return alert('Name already exists');
const o={};['name','nick','age','height','origin','faction','story','pers','style','abil','sigs','fin','weak','weapon'].forEach(k=>o[k]=g('c_'+k));o.align=g('c_align');o.look={};Object.keys(LOOK).forEach(k=>o.look[k]=g('l_'+k));o.look.c1=g('l_c1');o.look.c2=g('l_c2');o.stats={};STATS.forEach(k=>o.stats[k]=+g('s_'+k));if(imgData)o.img=imgData;imgData='';o.name=name;addF(o);open=o.id;go('Fighters')}
draw();
</script></body></html>
